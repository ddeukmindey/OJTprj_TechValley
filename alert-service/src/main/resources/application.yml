server:
  port: 8084

spring:
  application:
    name: alert-service
  datasource:
    url: jdbc:postgresql://postgres-alert:5432/techvalley_alert
    username: techvalley_admin
    password: password123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
