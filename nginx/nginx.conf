worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        server_name _;

        # ==== 1) LLM-service — PHẢI đặt trước /api/instances vì trùng prefix ====
        location ~ ^/api/instances/[0-9]+/diagnosis$ {
            proxy_pass         http://llm-service:8085;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   Authorization $http_authorization;
        }

        # ==== 2) Auth ====
        location /api/auth/ {
            proxy_pass         http://auth-gateway-service:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ==== 3) Instance ====
        location /api/instances {
            proxy_pass         http://instance-service:8081;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   Authorization $http_authorization;
        }

        # ==== 4) Client ====
        location /api/clients {
            proxy_pass         http://client-service:8082;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   Authorization $http_authorization;
        }

        # ==== 5) Monitoring ====
        location /api/monitor {
            proxy_pass         http://monitoring-service:8083;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   Authorization $http_authorization;
        }

        # ==== 6) Alert ====
        location /api/alerts {
            proxy_pass         http://alert-service:8084;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   Authorization $http_authorization;
        }

        # ==== 7) Chặn /internal/** — không cho lọt ra ngoài dưới mọi hình thức ====
        location /internal/ {
            deny all;
            return 403;
        }

        # ==== 8) Swagger UI — mở theo yêu cầu đề bài (slide #9: Swagger Demo) ====
        location /docs/instance/ {
            proxy_pass http://instance-service:8081/swagger-ui/;
            proxy_set_header Host $host;
        }
        location /docs/instance-api-docs {
            proxy_pass http://instance-service:8081/v3/api-docs;
        }

        location /docs/client/ {
            proxy_pass http://client-service:8082/swagger-ui/;
            proxy_set_header Host $host;
        }
        location /docs/client-api-docs {
            proxy_pass http://client-service:8082/v3/api-docs;
        }

        location /docs/monitor/ {
            proxy_pass http://monitoring-service:8083/swagger-ui/;
            proxy_set_header Host $host;
        }
        location /docs/monitor-api-docs {
            proxy_pass http://monitoring-service:8083/v3/api-docs;
        }

        location /docs/alert/ {
            proxy_pass http://alert-service:8084/swagger-ui/;
            proxy_set_header Host $host;
        }
        location /docs/alert-api-docs {
            proxy_pass http://alert-service:8084/v3/api-docs;
        }

        # ==== 9) Frontend (SPA) — mọi path còn lại ====
        root /usr/share/nginx/html;
        index index.html;
        location / {
            try_files $uri /index.html;
        }
    }
}