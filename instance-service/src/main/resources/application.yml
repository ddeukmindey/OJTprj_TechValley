server:
  port: 8081

spring:
  application:
    name: instance-service
  datasource:
    url: jdbc:postgresql://postgres-instance:5432/techvalley_instance
    username: techvalley_admin
    password: password123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  packagesToScan: com.techvalley.monitor.instance
  swagger-ui:
    path: /swagger-ui.html
    url: /docs/instance-api-docs
    config-url: /docs/instance-config

jwt:
  secret: 3DqK8sXv2NfL9pWa5RmTy7HuBcEeGhJk
client-service:
  base-url: ${CLIENT_SERVICE_URL:http://localhost:8082}

internal:
  api-key: ${INTERNAL_API_KEY:changeme-internal-key-please-override}

instance:
  cpu-warning-threshold: ${CPU_WARNING_THRESHOLD:80.0}

