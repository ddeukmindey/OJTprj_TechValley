version: '3.8'

services:
  # 1. Database Postgres
  postgres-db:
    image: postgres:15-alpine
    container_name: techvalley-postgres
    environment:
      POSTGRES_USER: techvalley_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: techvalley_db
    # Port 5432 chỉ mở khi môi trường Dev để dùng pgAdmin desktop/IDE connect trực tiếp
    # Production: xóa block ports này đi để chặn hoàn toàn kết nối từ bên ngoài
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - techvalley-net
  
  # 2. Database Admin GUI (pgAdmin 4)
  pgadmin:
    image: dpage/pgadmin4
    container_name: techvalley-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@techvalley.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres-db
    networks:
      - techvalley-net

  # 3. Auth & Gateway Service (Trần Bảo Châu)
  auth-gateway-service:
    build:
      context: .
      dockerfile: auth-gateway-service/Dockerfile
    container_name: auth-gateway-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/techvalley_db
      - SPRING_DATASOURCE_USERNAME=techvalley_admin
      - SPRING_DATASOURCE_PASSWORD=password123
    depends_on:
      - postgres-db
    networks:
      - techvalley-net

  # 4. Instance Microservice (Phan Thị Cẩm Ly)
  instance-service:
    build:
      context: .
      dockerfile: instance-service/Dockerfile
    container_name: instance-service
    # Không expose port ra ngoài host — chỉ giao tiếp nội bộ qua techvalley-net
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/techvalley_db
      - SPRING_DATASOURCE_USERNAME=techvalley_admin
      - SPRING_DATASOURCE_PASSWORD=password123
    depends_on:
      - postgres-db
    networks:
      - techvalley-net

  # 5. Client Microservice (Trịnh Lương Việt)
  client-service:
    build:
      context: .
      dockerfile: client-service/Dockerfile
    container_name: client-service
    # Không expose port ra ngoài host — chỉ giao tiếp nội bộ qua techvalley-net
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/techvalley_db
      - SPRING_DATASOURCE_USERNAME=techvalley_admin
      - SPRING_DATASOURCE_PASSWORD=password123
    depends_on:
      - postgres-db
    networks:
      - techvalley-net

  # 6. Monitoring Microservice (Thân Đức Minh)
  monitoring-service:
    build:
      context: .
      dockerfile: monitoring-service/Dockerfile
    container_name: monitoring-service
    # Không expose port ra ngoài host — chỉ giao tiếp nội bộ qua techvalley-net
    environment:
      # Bật Scheduler cho container PRIMARY này.
      # Nếu scale-out thêm container phụ, đặt MONITORING_SCHEDULER_ENABLED=false để tắt Cron Job.
      - MONITORING_SCHEDULER_ENABLED=true
    depends_on:
      - postgres-db
    networks:
      - techvalley-net

  # 7. Alert Microservice (Lê Thị Thuý Hằng)
  alert-service:
    build:
      context: .
      dockerfile: alert-service/Dockerfile
    container_name: alert-service
    # Không expose port ra ngoài host — chỉ giao tiếp nội bộ qua techvalley-net
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/techvalley_db
      - SPRING_DATASOURCE_USERNAME=techvalley_admin
      - SPRING_DATASOURCE_PASSWORD=password123
    depends_on:
      - postgres-db
    networks:
      - techvalley-net

  # 8. LLM Service (Spring Boot)
  llm-service:
    build:
      context: .
      dockerfile: llm-service/Dockerfile
    container_name: llm-service
    # Không expose port ra ngoài host — chỉ giao tiếp nội bộ qua techvalley-net
    networks:
      - techvalley-net

networks:
  techvalley-net:
    driver: bridge

volumes:
  pgdata: