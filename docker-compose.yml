version: '3.8'

services:
  # ==== DATABASE — mỗi service 1 Postgres + 1 volume riêng ====
  postgres-auth:
    image: postgres:15-alpine
    container_name: techvalley-postgres-auth
    environment:
      POSTGRES_USER: techvalley_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: techvalley_auth
    ports:
      - "5433:5432"
    volumes:
      - pgdata_auth:/var/lib/postgresql/data
    networks:
      - techvalley-net

  postgres-instance:
    image: postgres:15-alpine
    container_name: techvalley-postgres-instance
    environment:
      POSTGRES_USER: techvalley_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: techvalley_instance
    ports:
      - "5434:5432"
    volumes:
      - pgdata_instance:/var/lib/postgresql/data
    networks:
      - techvalley-net

  postgres-client:
    image: postgres:15-alpine
    container_name: techvalley-postgres-client
    environment:
      POSTGRES_USER: techvalley_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: techvalley_client
    ports:
      - "5435:5432"
    volumes:
      - pgdata_client:/var/lib/postgresql/data
    networks:
      - techvalley-net

  postgres-alert:
    image: postgres:15-alpine
    container_name: techvalley-postgres-alert
    environment:
      POSTGRES_USER: techvalley_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: techvalley_alert
    ports:
      - "5436:5432"
    volumes:
      - pgdata_alert:/var/lib/postgresql/data
    networks:
      - techvalley-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: techvalley-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@techvalley.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres-auth
      - postgres-instance
      - postgres-client
      - postgres-alert
    networks:
      - techvalley-net

  # ==== SERVICES ====
  auth-gateway-service:
    build:
      context: .
      dockerfile: auth-gateway-service/Dockerfile
    container_name: auth-gateway-service
    #ports:
    #  - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-auth:5432/techvalley_auth
      - SPRING_DATASOURCE_USERNAME=techvalley_admin
      - SPRING_DATASOURCE_PASSWORD=password123
    depends_on:
      - postgres-auth
    networks:
      - techvalley-net

  instance-service:
    build:
      context: .
      dockerfile: instance-service/Dockerfile
    container_name: instance-service
    #ports:
    #  - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-instance:5432/techvalley_instance
      - SPRING_DATASOURCE_USERNAME=techvalley_admin
      - SPRING_DATASOURCE_PASSWORD=password123
      - CLIENT_SERVICE_URL=http://client-service:8082
      - INTERNAL_API_KEY=t3chV4lley-Internal-2026
    depends_on:
      - postgres-instance
    networks:
      - techvalley-net

  client-service:
    build:
      context: .
      dockerfile: client-service/Dockerfile
    container_name: client-service
    #ports:
    #  - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-client:5432/techvalley_client
      - SPRING_DATASOURCE_USERNAME=techvalley_admin
      - SPRING_DATASOURCE_PASSWORD=password123
      - INSTANCE_SERVICE_URL=http://instance-service:8081
      - ALERT_SERVICE_URL=http://alert-service:8084
      - INTERNAL_API_KEY=t3chV4lley-Internal-2026
    depends_on:
      - postgres-client
      - instance-service
      - alert-service
    networks:
      - techvalley-net

  monitoring-service:
    build:
      context: .
      dockerfile: monitoring-service/Dockerfile
    container_name: monitoring-service
    #ports:
    #  - "8083:8083"
    environment:
      - INSTANCE_SERVICE_URL=http://instance-service:8081
      - ALERT_SERVICE_URL=http://alert-service:8084
      - CLIENT_SERVICE_URL=http://client-service:8082
      - INTERNAL_API_KEY=t3chV4lley-Internal-2026
    depends_on:
      - instance-service
      - alert-service
      - client-service
    networks:
      - techvalley-net

  alert-service:
    build:
      context: .
      dockerfile: alert-service/Dockerfile
    container_name: alert-service
    #ports:
    #  - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-alert:5432/techvalley_alert
      - SPRING_DATASOURCE_USERNAME=techvalley_admin
      - SPRING_DATASOURCE_PASSWORD=password123
      - CLIENT_SERVICE_URL=http://client-service:8082
      - INSTANCE_SERVICE_URL=http://instance-service:8081
      - INTERNAL_API_KEY=t3chV4lley-Internal-2026
    depends_on:
      - postgres-alert
    networks:
      - techvalley-net

  llm-service:
    build:
      context: .
      dockerfile: llm-service/Dockerfile
    container_name: llm-service
    #ports:
    #  - "8085:8085"
    environment:
      - INSTANCE_SERVICE_URL=http://instance-service:8081
      - ALERT_SERVICE_URL=http://alert-service:8084
      - LLM_USE_REAL_API=false
      - GEMINI_API_KEY=
      - INTERNAL_API_KEY=t3chV4lley-Internal-2026
    depends_on:
      - instance-service
      - alert-service
    networks:
      - techvalley-net

  nginx:
    image: nginx:1.25-alpine
    container_name: techvalley-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - auth-gateway-service
      - instance-service
      - client-service
      - monitoring-service
      - alert-service
      - llm-service
    networks:
      - techvalley-net

networks:
  techvalley-net:
    driver: bridge

# 4 volume riêng biệt = 4 service không đụng dữ liệu của nhau,
# và data KHÔNG mất khi container bị xóa/rebuild (chỉ mất khi bạn tự `docker volume rm`)
volumes:
  pgdata_auth:
  pgdata_instance:
  pgdata_client:
  pgdata_alert: